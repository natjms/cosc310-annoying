<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Annoying Food Delivery - Create a new restaurant</title>
	</head>
	<body>
		<h1> Create a new restaurant </h1>
		<form id='form' action='#'><br>
			<input name='owner_id' placeholder='ID of owner account' required><br>
			<input name='name' placeholder='Restaurant name' required><br>

			<input type='submit'>
		</form>

		<script>
document.addEventListener('DOMContentLoaded', () => {
	const form = document.getElementById('form');
	form.addEventListener('submit', async (e) => {
		e.preventDefault();

		await fetch(`/api/restaurant/`, {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(Object.fromEntries(new FormData(form))),
		});

		alert('New restaurant created');
		window.location.replace('/web/');
	});
});
		</script>
	</body>
</html>
