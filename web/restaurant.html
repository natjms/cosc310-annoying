<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Annoying Food Delivery - Restaurant</title>
	</head>
	<body>
		<p id='p:loading'>Loading...</p>
		<div id='div:restaurant-details' hidden>
			<h1 id='h1:title'></h1>
			<table>
				<tr>
					<td>Restaurant ID:</td>
					<td id='td:id'></td>
				</tr>
				<tr>
					<td>Owner ID:</td>
					<td id='td:owner_id'></td>
				</tr>
				<tr>
					<td>Name:</td>
					<td id='td:name'></td>
				</tr>
				<tr>
					<td>Description:</td>
					<td id='td:description'></td>
				</tr>
				<tr>
					<td>Address:</td>
					<td id='td:address'></td>
				</tr>
				<tr>
					<td>Phone number:</td>
					<td id='td:phone_number'></td>
				</tr>
				<tr>
					<td>Is active:</td>
					<td id='td:is_active'></td>
				</tr>
				<tr>
					<td>Cuisine IDs:</td>
					<td id='td:cuisine_ids'></td>
				</tr>
			</table>

			<p>
				<a id='a:update_link' href='#'>Update restaurant details</a>
			</p>

			<h2> Menus </h2>
			<ul id='ul:menus'></ul>
			<p>
				<a id='a:menu_create_link' href='#'>Add a menu</a>
			</p>
		</div>
		<script>

function render_restaurant_details(restaurant) {
	document.getElementById('h1:title').textContent = restaurant.name;
	document.getElementById('a:update_link').setAttribute('href', `/web/update-restaurant.html?id=${restaurant.id}`);
	document.getElementById('a:menu_create_link').setAttribute('href', `/web/create-menu.html?id=${restaurant.id}`);

	for (let key in restaurant) {
		let value = restaurant[key];
		if (!(typeof value === 'string' || typeof value === 'number')) {
			value = JSON.stringify(value);
		}
		document.getElementById(`td:${key}`)
			.textContent = value;
	}
}

function render_restaurant_menus(menus) {
	const params = new URLSearchParams(window.location.search);
	for (menu of menus) {
		let list_item = document.createElement('li');
		let anchor = document.createElement('a');
		anchor.textContent = menu.name;
		anchor.setAttribute('href', `/web/menu.html?id=${menu.id}&restaurant_id=${params.get('id')}`);
		list_item.appendChild(anchor);

		document.getElementById('ul:menus').appendChild(list_item);
	}
}

document.addEventListener('DOMContentLoaded', async () => {
	let ul_restaurants = document.getElementById('ul:restaurants');
	const params = new URLSearchParams(window.location.search);

	await fetch(`/api/restaurant/${params.get('id')}`)
		.then(body => body.json())
		.then(restaurant => render_restaurant_details(restaurant));

	await fetch(`/api/restaurant/${params.get('id')}/menu`)
		.then(body => body.json())
		.then(menus => render_restaurant_menus(menus));

	document.getElementById('p:loading')
		.setAttribute('hidden', 'hidden');
	document.getElementById('div:restaurant-details')
		.removeAttribute('hidden');
});

		</script>
	</body>
</html>
