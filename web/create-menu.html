<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Annoying Food Delivery - Create a new menu</title>
	</head>
	<body>
		<h1> Create a menu </h1>
		<form id='form' action='#' method='PATCH'><br>
			<input name='name' placeholder='Menu name' required><br>
			<input type='submit'>
		</form>
		<script>
document.addEventListener('DOMContentLoaded', () => {
	const params = new URLSearchParams(window.location.search);
	const form = document.getElementById('form');
	form.addEventListener('submit', async (e) => {
		e.preventDefault();

		let body = Object.fromEntries(new FormData(form));
		body['restaurant_id'] = params.get('id');

		await fetch(`/api/menu/create`, {
			method: 'PUT',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify(body),
		});

		alert('Menu created');
		window.location.replace(`/web/restaurant.html?id=${params.get('id')}`);
	});
});
		</script>
	</body>
</html>
