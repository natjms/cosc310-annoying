[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["app/repositories/repo.py","tests/"]

[tool.ruff.lint]
# Errors Warnings Naming Docstyle Bugs Upgrade Simplify FastAPI Async
select = [
"E",
"W",
"N", 
"D",
"B",
"UP",
"SIM",
"FAST",
"ASYNC",
] 

[tool.ruff.format]
quote-style = "double"

[tool.fastapi]
entrypoint = "app.main:app"
